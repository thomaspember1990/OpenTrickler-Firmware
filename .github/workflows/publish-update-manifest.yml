name: Publish Update Manifest

run-name: Publish update manifest for ${{ github.event.release.tag_name || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to publish (defaults to the tag that triggered this run)"
        required: false

permissions:
  contents: write  # required so gh release upload can attach assets to the release

jobs:
  publish:
    name: Build and attach update assets to the release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            ninja-build \
            python3

      - name: Configure
        run: |
          cmake -B "${{ github.workspace }}/build-pico2_w" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w

      - name: Build
        run: cmake --build "${{ github.workspace }}/build-pico2_w" --config Release

      - name: Build manifest + stage release assets
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}"
          python3 tools/publish_update_manifest.py \
            --bin "build-pico2_w/app.bin" \
            --version "$VERSION" \
            --notes "$RELEASE_NOTES" \
            --out-dir "publish_out"

      - name: Attach manifest.json + app.bin + app.uf2 to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          cp "build-pico2_w/app.uf2" "publish_out/OpenTrickler-Firmware-${TAG}.uf2"

          gh release upload "$TAG" \
            publish_out/manifest.json \
            publish_out/app.bin \
            "publish_out/OpenTrickler-Firmware-${TAG}.uf2" \
            --repo "${{ github.repository }}" \
            --clobber

          echo "Attached manifest.json, app.bin and OpenTrickler-Firmware-${TAG}.uf2 to release $TAG."